<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Matter, Thread, Zigbee et Wi-Fi  couches réseau domotique 2027</title>
  <desc id="desc">Schéma pédagogique : Matter est la couche application ; Thread et Wi-Fi transportent les paquets ; Zigbee cohabite via coordinateur ou pont.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="520" fill="url(#bg)" rx="12"/>
  <text x="460" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f766e">Domotique 2027 : qui fait quoi ?</text>
  <text x="460" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Matter = langage commun · Thread / Wi-Fi / Ethernet = transport radio ou filaire</text>

  <!-- Application layer -->
  <rect x="80" y="88" width="760" height="72" rx="10" fill="#0f766e" filter="url(#sh)"/>
  <text x="460" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">Couche APPLICATION  Matter 1.6</text>
  <text x="460" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ccfbf1">Appairage NFC · Multi-Admin · thermostats · Home Assistant / Apple / Google / Alexa</text>

  <!-- Transport -->
  <rect x="80" y="188" width="360" height="88" rx="10" fill="#14b8a6" filter="url(#sh)"/>
  <text x="260" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#042f2e">Thread (802.15.4 maillé IPv6)</text>
  <text x="260" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#042f2e">Border router : Apple TV, HomePod, HA ZBT-1/2, Aqara M3</text>
  <text x="260" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#042f2e">Matter-over-Thread : capteurs pile, serrures, vannes</text>

  <rect x="480" y="188" width="360" height="88" rx="10" fill="#f97316" filter="url(#sh)"/>
  <text x="660" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">Wi-Fi / Ethernet</text>
  <text x="660" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fff7ed">Shelly Pro, caméras PoE, prises Matter Wi-Fi</text>
  <text x="660" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fff7ed">Consommation temps réel, flux vidéo lourds</text>

  <!-- Arrows app to transport -->
  <path d="M260 160 L260 188" stroke="#0f766e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M660 160 L660 188" stroke="#0f766e" stroke-width="2"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs>

  <!-- Zigbee parallel -->
  <rect x="80" y="300" width="760" height="88" rx="10" fill="#6366f1" filter="url(#sh)"/>
  <text x="460" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">Zigbee 3.0 (802.15.4  réseau parallèle, pas Matter natif)</text>
  <text x="460" y="354" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e0e7ff">Coordinateur USB : ZHA / Zigbee2MQTT · Sonoff, Aqara, IKEA, Nous  catalogue immense</text>
  <text x="460" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e0e7ff">Pont Matter”Zigbee possible · cohabitation normale dans Home Assistant</text>

  <!-- Hub -->
  <rect x="280" y="410" width="360" height="72" rx="10" fill="#0b1f2a" filter="url(#sh)"/>
  <text x="460" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5eead4">Home Assistant 2026.10+ (cerveau local)</text>
  <text x="460" y="462" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Matter · Thread · Zigbee · Wi-Fi · énergie · caméras IA locales</text>

  <path d="M260 276 L320 410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M660 276 L600 410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M460 388 L460 410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="460" y="505" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">robot-educatif.info  domotique sans abonnement · oct. 2026</text>
</svg>
