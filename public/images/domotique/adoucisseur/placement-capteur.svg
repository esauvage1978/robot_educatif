<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Placement du capteur de niveau de sel sous le couvercle</title>
  <desc id="desc">Vue de dessus simplifiée : viser le bac à pastilles, éviter la vanne, la bouteille de résine et le puits à saumure ; électronique hors zone humide.</desc>
  <rect width="640" height="420" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="34" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Vue de dessus – où placer le capteur</text>

  <!-- Cabinet -->
  <rect x="40" y="56" width="380" height="300" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="230" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#334155">Bac de l’adoucisseur (couvercle ouvert)</text>

  <!-- Resin bottle -->
  <ellipse cx="145" cy="210" rx="70" ry="95" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="145" y="206" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Bouteille</text>
  <text x="145" y="224" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">de résine</text>
  <text x="145" y="244" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#1e40af">À éviter</text>

  <!-- Brine well -->
  <rect x="250" y="120" width="54" height="190" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="277" y="205" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#334155" transform="rotate(-90 277 205)">Puits à saumure</text>
  <text x="277" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">À éviter</text>

  <!-- Salt zone target -->
  <rect x="320" y="130" width="80" height="170" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="360" y="205" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#115e59">Pastilles</text>
  <text x="360" y="223" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#115e59">de sel</text>
  <text x="360" y="245" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#0f766e">Zone à viser</text>

  <!-- Sensor under lid -->
  <circle cx="360" cy="108" r="16" fill="#14b8a6" stroke="#0f766e" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#042f2e">ToF</text>
  <line x1="360" y1="124" x2="360" y2="175" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="372" y="100" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f766e">Capteur sous le couvercle</text>

  <!-- Control valve outside cabinet top -->
  <rect x="150" y="48" width="100" height="36" rx="8" fill="#1e293b" stroke="#0f172a"/>
  <text x="200" y="70" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Vanne / écran</text>
  <text x="200" y="40" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Hors zone de mesure</text>

  <!-- Electronics outside -->
  <rect x="460" y="100" width="150" height="200" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="535" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#9a3412">Hors bac</text>
  <text x="535" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#9a3412">ESP32 + boîtier</text>
  <text x="535" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#9a3412">Alim. USB 5 V</text>
  <text x="535" y="192" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#9a3412">Carte JSN (si</text>
  <text x="535" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#9a3412">ultrason)</text>
  <text x="535" y="240" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#7c2d12">Zone sèche</text>
  <text x="535" y="260" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#7c2d12">anti-corrosion</text>
  <path d="M460 180 C430 180, 420 120, 376 112" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="430" y="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#c2410c">câble</text>

  <text x="320" y="390" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#475569">Seul le capteur (ou la sonde étanche) regarde les pastilles ; l’électronique reste au sec.</text>
</svg>
