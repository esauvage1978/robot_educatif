<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t">
  <title id="t">Robot sans &#233;cran : tuiles et parcours au sol</title>
  <rect width="760" height="280" fill="#f6f8fa"/>
  <text x="380" y="28" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#24292f">Sans &#233;cran : la logique se joue sur le corps et le sol</text>
  <rect x="80" y="60" width="56" height="40" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <rect x="150" y="60" width="56" height="40" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
  <rect x="220" y="60" width="56" height="40" rx="4" fill="#ffebe9" stroke="#cf222e"/>
  <text x="180" y="120" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">Tuiles / jetons = ordres</text>
  <ellipse cx="480" cy="140" rx="100" ry="60" fill="none" stroke="#8250df" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="420" cy="140" r="12" fill="#8250df"/>
  <text x="480" y="210" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">Parcours physique = d&#233;composition de t&#226;che</text>
  <text x="380" y="252" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#24292f">Puis transition vers Scratch quand lecture et consignes longues tiennent.</text>
</svg>
