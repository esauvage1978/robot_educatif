  <text x="440" y="314" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">+ routine hebdo courte.</text>
  <text x="400" y="404" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#8c959f">Illustration p&#233;dagogique &#8212; ROBOT &#233;ducatif</text>
