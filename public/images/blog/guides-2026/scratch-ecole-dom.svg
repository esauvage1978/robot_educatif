  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="18" font-weight="700" fill="#24292f">Deux contextes, deux leviers</text>
  <rect x="32" y="56" width="360" height="340" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
