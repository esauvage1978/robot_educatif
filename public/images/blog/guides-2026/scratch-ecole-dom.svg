  <text x="64" y="294" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">Consigne claire + fin de s&#233;ance</text>
  <text x="64" y="314" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">visible (livrable partageable).</text>
  <rect x="424" y="248" width="328" height="120" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="440" y="272" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#24292f">Levier principal</text>
