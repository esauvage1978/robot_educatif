<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t">
  <title id="t">Scratch : contraintes &#224; l&apos;&#233;cole et &#224; la maison</title>
  <defs>
