<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="t">
  <title id="t">Raspberry Pi ou robot cl&#233; en main</title>
  <rect width="800" height="240" fill="#f6f8fa"/>
  <text x="400" y="28" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#24292f">Ado : choisir le bon type de &#171; projet principal &#187;</text>
  <rect x="60" y="52" width="300" height="160" rx="8" fill="#fff" stroke="#bf8700" stroke-width="2"/>
  <text x="210" y="84" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#bf8700">Raspberry Pi / Linux</text>
  <text x="72" y="114" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; Serveur, Python, GPIO, cam&#233;ra</text>
  <text x="72" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; Temps adulte : SD, mises &#224; jour</text>
  <text x="72" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; Tr&#232;s ouvert, moins &#171; guid&#233; &#187;</text>
  <rect x="440" y="52" width="300" height="160" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/>
  <text x="590" y="84" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#0969da">Robot &#233;ducatif</text>
  <text x="452" y="114" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; Objectif visible en d&#233;mo</text>
  <text x="452" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; mBlock / Scratch document&#233;s</text>
  <text x="452" y="158" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">&#8226; Moins de sysadmin</text>
  <text x="400" y="218" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#24292f">Les deux peuvent cohabiter plus tard si l&apos;int&#233;r&#234;t dure.</text>
</svg>
