<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="t">
  <title id="t">Occasions de cadeaux robotique</title>
  <rect width="800" height="200" fill="#f6f8fa"/>
  <text x="400" y="32" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#24292f">M&#234;me cadeau, autre contexte</text>
  <rect x="80" y="60" width="160" height="100" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="160" y="100" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" fill="#24292f">Rentr&#233;e</text>
  <text x="160" y="128" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#57606a">Rythme et devoirs</text>
  <rect x="320" y="60" width="160" height="100" rx="8" fill="#fff" stroke="#0969da"/>
  <text x="400" y="100" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0969da">No&#235;l</text>
  <text x="400" y="128" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#57606a">Temps long + pile</text>
  <rect x="560" y="60" width="160" height="100" rx="8" fill="#fff" stroke="#1f883d"/>
  <text x="640" y="100" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1f883d">Anniversaire</text>
  <text x="640" y="128" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#57606a">Projet avec copains</text>
  <text x="400" y="178" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#8c959f">Ajoutez toujours un cr&#233;neau d&apos;installation pr&#233;vu avec l&apos;enfant.</text>
</svg>
