<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t">
  <title id="t">mBot selectionne dans la bibliotheque</title>
  <rect width="800" height="480" fill="#1a1f2e"/>
  <rect x="120" y="60" width="560" height="360" rx="6" fill="#fff" stroke="#d0d7de"/>
  <rect x="120" y="60" width="560" height="40" fill="#0078d7"/>
  <text x="140" y="86" fill="#fff" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600">Bibliotheque d&apos;appareils</text>
  <rect x="140" y="150" width="520" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="156" y="178" fill="#1e40af" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600">mBot</text>
  <text x="600" y="178" fill="#2563eb" font-family="Segoe UI,system-ui,sans-serif" font-size="12">selectionne</text>
