<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="titre repere-desc">
	<title id="titre">Rep&#232;re orthonorm&#233; de la sc&#232;ne mBlock / Scratch</title>
	<desc id="repere-desc">Origine au centre ; axe X de -240 &#224; +240 ; axe Y de -180 &#224; +180.</desc>
	<defs>
		<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
			<path d="M0,0 L8,4 L0,8 z" fill="#1e3a5f"/>
		</marker>
	</defs>
	<rect width="640" height="440" fill="#f1f5f9"/>
	<text x="320" y="28" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Rep&#232;re de la sc&#232;ne (mBlock / Scratch)</text>
	<text x="320" y="46" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#475569">480 &#215; 360 px &#8212; coordonn&#233;es en pas (pixels de la sc&#232;ne)</text>
	<rect x="80" y="70" width="480" height="360" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
	<g stroke="#e2e8f0" stroke-width="1">
		<line x1="320" y1="70" x2="320" y2="430"/>
		<line x1="80" y1="250" x2="560" y2="250"/>
	</g>
	<line x1="80" y1="250" x2="560" y2="250" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/>
	<line x1="320" y1="430" x2="320" y2="70" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/>
	<circle cx="320" cy="250" r="5" fill="#0d9488"/>
	<text x="332" y="244" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0f172a">(0, 0)</text>
	<text x="335" y="268" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">origine</text>
	<text x="548" y="242" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">x</text>
	<text x="308" y="82" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">y</text>
	<text x="80" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">-240</text>
	<text x="560" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">+240</text>
	<text x="320" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">axe X</text>
	<text x="310" y="88" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">+180</text>
	<text x="310" y="438" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">-180</text>
	<text x="368" y="258" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">axe Y</text>
	<text x="320" y="418" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Y augmente vers le haut (+180 en haut, -180 en bas).</text>
</svg>
