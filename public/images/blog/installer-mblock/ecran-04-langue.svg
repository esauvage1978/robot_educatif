  <rect x="560" y="340" width="88" height="28" rx="2" fill="#0078d7"/>
  <text x="604" y="358" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="13">OK</text>
  <text x="400" y="430" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,sans-serif" font-size="11">Libell&#233;s pouvant varier selon la version (Language / OK).</text>
