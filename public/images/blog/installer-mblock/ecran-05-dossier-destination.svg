<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t">
  <title id="t">Repr&#233;sentation : assistant &#8211; dossier d'installation</title>
  <rect width="800" height="480" rx="10" fill="#0d1117"/>
  <rect x="100" y="36" width="600" height="408" rx="2" fill="#fff" stroke="#ccc"/>
  <rect x="100" y="36" width="600" height="32" fill="#0078d7"/>
  <text x="120" y="57" fill="#fff" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600">mBlock &#8211; Installation</text>
  <text x="120" y="100" fill="#000" font-family="Segoe UI,sans-serif" font-size="14">Le programme sera install&#233; dans le dossier suivant :</text>
  <rect x="120" y="118" width="520" height="28" fill="#fff" stroke="#7a7a7a"/>
  <text x="128" y="136" fill="#000" font-family="Consolas,monospace" font-size="12">C:\Program Files\mblock\</text>
  <text x="120" y="175" fill="#57606a" font-family="Segoe UI,sans-serif" font-size="12">En g&#233;n&#233;ral, conservez ce chemin sauf besoin particulier.</text>
  <rect x="120" y="380" width="100" height="28" rx="2" fill="#e1e1e1" stroke="#adadad"/>
  <text x="170" y="398" text-anchor="middle" fill="#000" font-family="Segoe UI,sans-serif" font-size="13">&lt; Pr&#233;c&#233;dent</text>
  <rect x="580" y="380" width="100" height="28" rx="2" fill="#0078d7"/>
  <text x="630" y="398" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="13">Suivant &gt;</text>
  <text x="400" y="450" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,sans-serif" font-size="11">Parcourir& permet de choisir un autre disque ou dossier.</text>
</svg>
