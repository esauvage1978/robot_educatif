<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="t">
  <title id="t">Raspberry Pi Imager : encha&#238;nement des &#233;tapes</title>
  <rect width="680" height="210" fill="#f6f8fa"/>
  <text x="340" y="26" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#24292f">Flasher la carte microSD avec Raspberry Pi Imager</text>
  <g font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">
    <rect x="20" y="48" width="150" height="130" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/>
    <text x="95" y="76" text-anchor="middle" font-weight="600" fill="#0969da">1. Choisir l&apos;OS</text>
    <text x="32" y="102">Raspberry Pi OS</text>
    <text x="32" y="120">(32 ou 64 bits)</text>
    <text x="32" y="148" font-size="10">Ubuntu, LibreELEC&#8230;</text>
    <text x="95" y="178" text-anchor="middle" font-size="10" fill="#6e7781">Engrenage = options</text>
    <text x="95" y="192" text-anchor="middle" font-size="10" fill="#6e7781">avanc&#233;es (SSH, Wi-Fi)</text>
    <text x="188" y="118" font-size="22" fill="#24292f">&#8594;</text>
    <rect x="220" y="48" width="150" height="130" rx="8" fill="#fff" stroke="#bf8700" stroke-width="2"/>
    <text x="295" y="76" text-anchor="middle" font-weight="600" fill="#bf8700">2. Stockage</text>
    <text x="232" y="108">Carte microSD</text>
    <text x="232" y="128">(USB ou slot</text>
    <text x="232" y="148">ordinateur)</text>
    <text x="398" y="118" font-size="22" fill="#24292f">&#8594;</text>
    <rect x="430" y="48" width="150" height="130" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
    <text x="505" y="76" text-anchor="middle" font-weight="600" fill="#1a7f37">3. &#201;crire</text>
    <text x="442" y="112">WRITE</text>
    <text x="442" y="132" font-size="10">Confirmer le disque</text>
    <text x="442" y="150" font-size="10">(tout est effac&#233;)</text>
    <text x="608" y="118" font-size="22" fill="#24292f">&#8594;</text>
    <rect x="640" y="48" width="28" height="130" rx="6" fill="#eaeef2" stroke="#57606a"/>
    <text x="654" y="100" text-anchor="middle" font-size="10" fill="#24292f" transform="rotate(-90 654 110)">SD dans le Pi</text>
  </g>
</svg>
