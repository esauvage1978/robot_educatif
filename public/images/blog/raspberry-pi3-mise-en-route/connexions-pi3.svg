<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t">
  <title id="t">Sch&#233;ma des branchements usuels Raspberry Pi 3 Mod&#232;le B</title>
  <rect width="640" height="280" fill="#f6f8fa"/>
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#24292f">Branchements typiques (vue sch&#233;matique)</text>
  <!-- Board silhouette -->
  <rect x="180" y="72" width="280" height="168" rx="12" fill="#1a7f37" stroke="#0d5324" stroke-width="2"/>
  <rect x="200" y="92" width="100" height="72" rx="4" fill="#0d1117" opacity="0.85"/>
  <text x="250" y="132" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,system-ui,sans-serif" font-size="10">SoC</text>
  <rect x="320" y="100" width="40" height="24" rx="2" fill="#30363d"/>
  <text x="340" y="116" text-anchor="middle" fill="#fff" font-family="Segoe UI,system-ui,sans-serif" font-size="8">USB</text>
  <rect x="368" y="100" width="40" height="24" rx="2" fill="#30363d"/>
  <text x="388" y="116" text-anchor="middle" fill="#fff" font-family="Segoe UI,system-ui,sans-serif" font-size="8">USB</text>
  <rect x="320" y="132" width="88" height="20" rx="2" fill="#30363d"/>
  <text x="364" y="146" text-anchor="middle" fill="#fff" font-family="Segoe UI,system-ui,sans-serif" font-size="8">Ethernet</text>
  <rect x="200" y="176" width="240" height="14" rx="2" fill="#21262d"/>
  <text x="320" y="186" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,system-ui,sans-serif" font-size="8">GPIO 40 broches</text>
  <!-- Labels -->
  <g font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#24292f">
    <line x1="120" y1="48" x2="220" y2="88" stroke="#57606a" stroke-dasharray="4 2"/>
    <text x="16" y="44">Alim. micro-USB 5 V</text>
    <text x="16" y="58" font-size="10" fill="#6e7781">(2,5 A conseill&#233;)</text>
    <line x1="520" y1="48" x2="420" y2="88" stroke="#57606a" stroke-dasharray="4 2"/>
    <text x="440" y="40">HDMI pleine taille</text>
    <text x="440" y="54" font-size="10" fill="#6e7781">&#201;cran / adaptateur</text>
    <line x1="320" y1="260" x2="320" y2="240" stroke="#57606a" stroke-dasharray="4 2"/>
    <text x="240" y="272" text-anchor="middle">Carte microSD</text>
    <text x="400" y="272" text-anchor="middle" font-size="10" fill="#6e7781">(sous la carte, face contacts vers le haut)</text>
  </g>
</svg>
